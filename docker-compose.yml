version: "3.8"

# 3-node raftkv cluster.
# Usage:
#   docker compose up -d
#   docker compose exec node1 raftkv-cli --peers node1=node1:7001,node2=node2:7001,node3=node3:7001 put foo bar
#   docker compose down -v   # stop and wipe data

services:
  node1:
    build: .
    container_name: raftkv-node1
    command:
      - --id=node1
      - --listen=0.0.0.0:7001
      - --peers=node2=node2:7001,node3=node3:7001
      - --data-dir=/data
    volumes:
      - node1-data:/data
    ports:
      - "7001:7001"
    networks:
      - raftkv

  node2:
    build: .
    container_name: raftkv-node2
    command:
      - --id=node2
      - --listen=0.0.0.0:7001
      - --peers=node1=node1:7001,node3=node3:7001
      - --data-dir=/data
    volumes:
      - node2-data:/data
    ports:
      - "7002:7001"
    networks:
      - raftkv

  node3:
    build: .
    container_name: raftkv-node3
    command:
      - --id=node3
      - --listen=0.0.0.0:7001
      - --peers=node1=node1:7001,node2=node2:7001
      - --data-dir=/data
    volumes:
      - node3-data:/data
    ports:
      - "7003:7001"
    networks:
      - raftkv

volumes:
  node1-data:
  node2-data:
  node3-data:

networks:
  raftkv:
    driver: bridge
