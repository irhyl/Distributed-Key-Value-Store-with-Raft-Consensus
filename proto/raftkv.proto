syntax = "proto3";

package raftkv;

option go_package = "github.com/raftkv/proto";

// ─────────────────────────────────────────────
//  Core Raft data types
// ─────────────────────────────────────────────

// A single entry in the replicated log.
// Every state change (KV put/delete) flows through here.
message LogEntry {
  uint64 index   = 1; // position in the log (1-based, monotonically increasing)
  uint64 term    = 2; // the Raft term when this entry was created
  bytes  data    = 3; // serialized KVCommand
  EntryType type = 4;
}

enum EntryType {
  ENTRY_NORMAL   = 0; // regular KV operation
  ENTRY_CONFIG   = 1; // cluster membership change (advanced; reserved)
}

// The actual KV operation stored inside LogEntry.data
message KVCommand {
  OpType op    = 1;
  string key   = 2;
  bytes  value = 3;
}

enum OpType {
  OP_PUT    = 0;
  OP_DELETE = 1;
}

// ─────────────────────────────────────────────
//  Raft RPC: RequestVote
//  Sent by a candidate during leader election.
// ─────────────────────────────────────────────
message RequestVoteRequest {
  uint64 term           = 1; // candidate's current term
  string candidate_id   = 2; // who is asking for the vote
  uint64 last_log_index = 3; // index of candidate's last log entry
  uint64 last_log_term  = 4; // term  of candidate's last log entry
}

message RequestVoteResponse {
  uint64 term         = 1; // responder's current term (so candidate can update itself)
  bool   vote_granted = 2;
}

// ─────────────────────────────────────────────
//  Raft RPC: AppendEntries
//  Dual purpose: replicate log entries AND act as heartbeat (empty entries).
// ─────────────────────────────────────────────
message AppendEntriesRequest {
  uint64            term           = 1; // leader's term
  string            leader_id      = 2; // so followers can redirect clients
  uint64            prev_log_index = 3; // index of entry immediately before new ones
  uint64            prev_log_term  = 4; // term of prev_log_index entry
  repeated LogEntry entries        = 5; // empty = heartbeat
  uint64            leader_commit  = 6; // leader's commitIndex
}

message AppendEntriesResponse {
  uint64 term          = 1; // follower's current term
  bool   success       = 2; // false if log consistency check failed
  uint64 match_index   = 3; // highest index known to be replicated on this follower
  uint64 conflict_term = 4; // optimization: term of conflicting entry (for fast rollback)
  uint64 conflict_index= 5; // first index of that conflicting term
}

// ─────────────────────────────────────────────
//  Raft RPC: InstallSnapshot
//  Leader sends a full snapshot to a lagging follower.
// ─────────────────────────────────────────────
message InstallSnapshotRequest {
  uint64 term                = 1;
  string leader_id           = 2;
  uint64 last_included_index = 3; // snapshot covers log up to this index
  uint64 last_included_term  = 4;
  uint64 offset              = 5; // byte offset in snapshot stream (chunked transfer)
  bytes  data                = 6;
  bool   done                = 7; // last chunk?
}

message InstallSnapshotResponse {
  uint64 term    = 1;
  bool   success = 2; // false if this chunk was rejected (stale snapshot or offset mismatch)
}

// ─────────────────────────────────────────────
//  KV Service (client-facing)
// ─────────────────────────────────────────────
message GetRequest  { string key = 1; }
message GetResponse {
  string key     = 1;
  bytes  value   = 2;
  bool   found   = 3;
  string leader_hint = 4; // if not leader, tell client where to go
}

message PutRequest  { string key = 1; bytes value = 2; }
message PutResponse {
  bool   success     = 1;
  string leader_hint = 2;
}

message DeleteRequest  { string key = 1; }
message DeleteResponse {
  bool   success     = 1;
  string leader_hint = 2;
}

// ─────────────────────────────────────────────
//  KV Service: Watch (change data capture)
//  Streams every committed write as it's applied to this node's state
//  machine, in commit order. The first streaming RPC in this codebase.
// ─────────────────────────────────────────────
message WatchRequest {
  string key_prefix = 1; // only stream keys with this prefix; empty = all keys
}

message ChangeEvent {
  uint64 index = 1; // Raft log index this write committed at
  uint64 term  = 2; // Raft term the entry was created in
  OpType op    = 3;
  string key   = 4;
  bytes  value = 5; // empty for OP_DELETE
}

// ─────────────────────────────────────────────
//  Service definitions
// ─────────────────────────────────────────────

// Internal service — nodes talk to each other
service RaftService {
  rpc RequestVote      (RequestVoteRequest)      returns (RequestVoteResponse);
  rpc AppendEntries    (AppendEntriesRequest)    returns (AppendEntriesResponse);
  rpc InstallSnapshot  (InstallSnapshotRequest)  returns (InstallSnapshotResponse);
}

// External service — clients talk to this
service KVService {
  rpc Get    (GetRequest)    returns (GetResponse);
  rpc Put    (PutRequest)    returns (PutResponse);
  rpc Delete (DeleteRequest) returns (DeleteResponse);
  rpc Watch  (WatchRequest)  returns (stream ChangeEvent); // change data capture
}
